[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "az-gh"
version = "0.1.0"
description = "A gh-compatible Azure DevOps command line client"
requires-python = ">=3.9"

[project.scripts]
gh = "azgh.commands:main"

[tool.setuptools.packages.find]
include = ["azgh*"]
